version: "2"
linters:
  enable:
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
    - bodyclose
    - noctx
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G204 # ccx deliberately execs the system ssh with user-chosen args
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]
      - linters: [revive]
        text: "that stutters"
formatters:
  enable:
    - gofmt
    - goimports
