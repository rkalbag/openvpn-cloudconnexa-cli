version: 2
project_name: ccx
before:
  hooks:
    - go mod tidy
builds:
  - main: ./cmd/ccx
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/rkalbag/openvpn-cloudconnexa-cli/internal/cli.Version={{.Version}} -X github.com/rkalbag/openvpn-cloudconnexa-cli/internal/cli.InstallRef={{.Tag}}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, NOTICE, README.md]
checksum:
  name_template: checksums.txt
release:
  extra_files:
    - glob: scripts/install.sh
homebrew_casks:
  - repository:
      owner: rkalbag
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/rkalbag/openvpn-cloudconnexa-cli
    description: Remote connectivity using CloudConnexa made simpler with a CLI (unofficial)
    license: Apache-2.0
    # The macOS binaries are not signed or notarised yet, so tell the user
    # how to clear the quarantine flag rather than clearing it for them.
    caveats: |
      ccx is not yet signed by Apple. If macOS says Apple could not verify
      "ccx" is free of malware, click Done (not Move to Trash), then clear
      the quarantine flag once:
        xattr -d com.apple.quarantine "$(brew --prefix)/bin/ccx"
      If xattr says "No such xattr", the flag is already gone: run ccx again.
